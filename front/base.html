<!DOCTYPE html>
<html>
<head>
    <title>Горьковская ЖД - Маршруты с километражом</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div id="authModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Вход в систему</h2>
            </div>
            <div class="modal-body">
                <form id="authForm" onsubmit="handleAuth(event)">
                    <div class="form-group">
                        <label for="authLogin">Логин</label>
                        <input type="text" id="authLogin" placeholder="Введите логин" value="admin" required>
                    </div>
                    <div class="form-group">
                        <label for="authPassword">Пароль</label>
                        <input type="password" id="authPassword" placeholder="Введите пароль" value="admin123" required>
                    </div>
                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" id="isRegister" onchange="toggleAuthMode()">
                            Зарегистрироваться
                        </label>
                    </div>
                    <div id="registerFields" style="display:none;">
                        <div class="form-group">
                            <label for="authName">ФИО</label>
                            <input type="text" id="authName" placeholder="Введите ФИО">
                        </div>
                        <div class="form-group">
                            <label for="authEmail">Email</label>
                            <input type="email" id="authEmail" placeholder="Введите email">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="authBtn">Войти</button>
                    <div id="authError" class="error-message"></div>
                </form>
            </div>
        </div>
    </div>


    <div id="app" style="display:none;">
        <div class="header">
            <div>
                <h1>Горьковская ЖД</h1>
                <p id="userInfo">Кликните на станцию для добавления в маршрут</p>
            </div>
            <div class="controls">
                <div class="search-box">
                    <input id="searchInput" type="text" placeholder="Поиск станции" oninput="searchStations(this.value)">
                </div>
                <button class="primary" onclick="buildRoute()">Построить маршрут</button>
                <button class="clear" onclick="clearRoute()">Очистить</button>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
        </div>

        <div id="adminPanel" class="admin-panel" style="display:none;">
            <div class="admin-tools">
                <button onclick="toggleAdminMode()" class="btn admin-toggle active">
                    Режим администратора
                </button>
                <button onclick="clearAdminData()" class="btn clear">Очистить все данные об опорных пунктах</button>
            </div>
            <div id="adminStatus" class="admin-status"></div>
        </div>

        <div class="stats" id="stats">
            <span>Загрузка данных...</span>
            <span id="routeStatus">Маршрут: <span style="color:#2980b9; font-weight:bold;">выберите станции</span></span>
        </div>

        <div id="map">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <h3>Загрузка данных</h3>
                <p style="color: #666; font-size: 14px;">Подключение к серверу...</p>
            </div>
        </div>

        <div id="toast" class="toast"></div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-line road"></div>
                <span>Железные дороги</span>
            </div>
            <div class="legend-item">
                <div class="legend-line route"></div>
                <span>Маршрут</span>
            </div>
            <div class="legend-item">
                <div class="legend-marker"></div>
                <span>Станции</span>
            </div>
            <div class="legend-item">
                <div class="legend-marker route-point"></div>
                <span>Точки маршрута</span>
            </div>
            <div class="legend-item" id="baseStationLegend" style="display:none;">
                <div class="legend-marker base-station"></div>
                <span>Опорная станция</span>
            </div>
            <div style="margin-top:8px; font-size:11px; color:#999;">
                Кликните на станцию для добавления в маршрут
            </div>
        </div>
    </div>

    <script src="js/logic.js"></script>
</body>
</html>
